<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1033">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Referee: Mission: Return to Station</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%230B1033%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%226%22 fill=%22%234F8BFF%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2211%22 fill=%22none%22 stroke=%22%23FF5C5C%22 stroke-width=%222%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/vendor/chakra-petch/latin-500.css">
  <link rel="stylesheet" href="/vendor/chakra-petch/latin-700.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/ref.css">
</head>
<body class="ref">
  <header class="bar">
    <div class="who">
      <p class="role"></p>
      <h1 class="player"></h1>
    </div>
    <p class="link" data-state="connecting"><span class="led" aria-hidden="true"></span><span class="link-text"></span></p>
  </header>

  <main>
    <section class="card" aria-live="polite">
      <div class="card-top">
        <img class="ship" alt="" hidden>
        <div class="card-status">
          <p class="phase-hint"></p>
          <p class="status"></p>
        </div>
        <p class="score"><span class="score-num"></span><span class="score-label"></span></p>
      </div>
      <div class="gauges">
        <div class="shields" role="img"></div>
        <p class="hits"></p>
      </div>
      <div class="fuel">
        <div class="fuel-head"><span class="fuel-label"></span><span class="fuel-sec"></span></div>
        <div class="bar-track"><div class="fill"></div></div>
      </div>
    </section>

    <section class="setup">
      <label class="name-label" for="name"></label>
      <input id="name" name="name" type="text" maxlength="24" autocomplete="off" autocapitalize="words" enterkeyhint="done" spellcheck="false">
      <button class="btn primary" id="ready" type="button"></button>
      <button class="btn" id="solo" type="button"></button>
    </section>

    <section class="race">
      <button class="btn test" id="testHit" type="button" hidden></button>
      <button class="btn" id="undo" type="button"></button>
      <button class="btn" id="finish" type="button"></button>
      <button class="btn danger" id="reset" type="button"></button>
    </section>
  </main>

  <div id="denied" hidden><p></p></div>

  <script type="module" src="/js/ref.js"></script>
</body>
</html>
